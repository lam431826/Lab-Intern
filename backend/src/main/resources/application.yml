spring:
  application:
    name: dxlab-recruitment
  config:
    # Đọc .env ở thư mục chạy hoặc thư mục cha (gốc repo) như file properties.
    # Biến môi trường thật vẫn được ưu tiên hơn.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:dxlab_recruitment};encrypt=true;trustServerCertificate=${DB_TRUST_CERT:false};sendStringParametersAsUnicode=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    open-in-view: false
    hibernate:
      # Schema chỉ do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp với bảng.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # String -> NVARCHAR (khớp quy ước migration, giữ nguyên dấu tiếng Việt)
        use_nationalized_character_data: true
        type:
          # Instant -> DATETIME2 thay vì DATETIMEOFFSET
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

app:
  # Trang người được mời mở ra sau khi bấm link trong email Clerk
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  bootstrap:
    # Email Người tổ chức đầu tiên trên máy chủ mới (xem OrganizerBootstrap); để trống sau khi đã tạo
    organizer-email: ${BOOTSTRAP_ORGANIZER_EMAIL:}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  clerk:
    # Frontend API URL của instance Clerk (Dashboard -> API keys); bắt buộc
    issuer: ${CLERK_ISSUER:}
    authorized-parties: ${CLERK_AZP:http://localhost:5173}
    secret-key: ${CLERK_SECRET_KEY:}
    webhook-secret: ${CLERK_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
