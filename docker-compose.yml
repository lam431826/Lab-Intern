# Triển khai Hệ thống Tuyển dụng DX Lab trên một máy chủ của lab.
#   docker compose up -d --build
# Mọi bí mật lấy từ file .env cạnh file này (xem .env.example). Hướng dẫn vận hành: docs/runbook.md

name: dxlab-recruitment

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Thiếu MSSQL_SA_PASSWORD trong .env}
      # Express miễn phí cho dùng thật (giới hạn 10 GB mỗi database, đủ cho dữ liệu tuyển dụng)
      MSSQL_PID: ${MSSQL_PID:-Express}
      TZ: Asia/Ho_Chi_Minh
      # KHÔNG đặt MSSQL_COLLATION: đổi collation cấp server làm hỏng xp_userlock mà Flyway dùng để khóa
      # migration. Collation không dấu đặt ở cấp database trong init-db.sql.
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
    # Chỉ mở cho máy chủ (công cụ quản trị, sao lưu); không mở ra mạng ngoài
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Chạy một lần mỗi khi "up": tạo database, login ứng dụng (bỏ qua nếu đã có) rồi thoát
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-dxlab_recruitment}
      DB_USER: ${DB_USER:-dxlab_app}
      DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    volumes:
      - ./infra/mssql/init-db.sql:/init/init-db.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -f 65001
        -i /init/init-db.sql
        -v DB_NAME="$$DB_NAME" APP_LOGIN="$$DB_USER" APP_PASSWORD="$$DB_PASSWORD"
    restart: "no"

  app:
    build: ./backend
    image: dxlab-recruitment-backend:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Ghi đè giá trị dành cho máy dev trong .env
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mssql
      DB_PORT: "1433"
      # Chứng chỉ tự ký của container SQL Server; kết nối vẫn mã hóa
      DB_TRUST_CERT: "true"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mssql-data:
